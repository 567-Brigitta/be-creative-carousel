<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BE Creative Selected Work</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}

.carousel {
  position: relative;
  width: 100%;
  overflow: hidden;
  touch-action: pan-y;
}

.viewport {
  overflow: hidden;
}

.track {
  display: flex;
  transition: transform 1.15s cubic-bezier(.4,0,.2,1);
  will-change: transform;
}

.slide {
  flex: 0 0 100%;
  aspect-ratio: 16 / 9;
}

.slide img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.arrow {
  position: absolute;
  top: calc(50% - 19px);
  transform: translateY(-50%);
  width: 38px;
  height: 54px;
  border: 0;
  background: rgba(255,255,255,.78);
  color: #333;
  font: 30px/1 Arial, sans-serif;
  cursor: pointer;
  padding: 0;
}

.prev {
  left: 0;
}

.next {
  right: 0;
}

.dots {
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.dot {
  width: 8px;
  height: 8px;
  border: 0;
  border-radius: 50%;
  padding: 0;
  background: #b7b7b7;
  cursor: pointer;
}

.dot.active {
  background: #ef9855;
}

@media (max-width: 600px) {
  .arrow {
    width: 32px;
    height: 46px;
    font-size: 25px;
  }

  .dots {
    height: 32px;
    gap: 7px;
  }

  .dot {
    width: 7px;
    height: 7px;
  }
}
</style>
</head>

<body>

<div class="carousel" id="carousel">

  <div class="viewport">
    <div class="track" id="track">

      <div class="slide">
        <img src="images/01_Huhtamaki.jpg" alt="Huhtamaki packaging design">
      </div>

      <div class="slide">
        <img src="images/02_Investa.jpg" alt="Investa annual report design">
      </div>

      <div class="slide">
        <img src="images/03_KRB.jpg" alt="Kincoppal-Rose Bay campaign design">
      </div>

      <div class="slide">
        <img src="images/04_Jojoba.jpg" alt="The Jojoba Company packaging design">
      </div>

      <div class="slide">
        <img src="images/05_CSIRO.jpg" alt="CSIRO report design">
      </div>

      <div class="slide">
        <img src="images/06_Manly_Jazz.jpg" alt="Manly Jazz Festival event design">
      </div>

      <div class="slide">
        <img src="images/07_Engineers_Australia.jpg" alt="Engineers Australia conference design">
      </div>

      <div class="slide">
        <img src="images/08_WSU_Yarramundi.jpg" alt="Western Sydney University Yarramundi Lectures publication design">
      </div>

      <div class="slide">
        <img src="images/09_WSU_Course_Booklets.jpg" alt="Western Sydney University course booklet design">
      </div>

      <!-- Duplicate first slide creates seamless forward loop -->
      <div class="slide clone" aria-hidden="true">
        <img src="images/01_Huhtamaki.jpg" alt="">
      </div>

    </div>
  </div>

  <button class="arrow prev" id="prev" aria-label="Previous project">‹</button>
  <button class="arrow next" id="next" aria-label="Next project">›</button>

  <div class="dots" id="dots" aria-label="Project navigation"></div>

</div>

<script>
const track = document.getElementById('track');
const carousel = document.getElementById('carousel');
const dots = document.getElementById('dots');

const realCount = 9;

let index = 0;
let startX = null;
let timer = null;
let locked = false;

/* Create navigation dots */
for (let i = 0; i < realCount; i++) {
  const button = document.createElement('button');

  button.className = 'dot';
  button.setAttribute('aria-label', 'Go to project ' + (i + 1));

  button.onclick = () => {
    go(i);
    restart();
  };

  dots.appendChild(button);
}

const dotButtons = [...dots.children];

/* Update active dot */
function paintDots() {
  const visibleIndex = index === realCount ? 0 : index;

  dotButtons.forEach((dot, number) => {
    dot.classList.toggle('active', number === visibleIndex);
  });
}

/* Move carousel */
function move(animated = true) {

  track.style.transition = animated
    ? 'transform 1.15s cubic-bezier(.4,0,.2,1)'
    : 'none';

  track.style.transform =
    `translateX(-${index * 100}%)`;

  paintDots();
}

/* Jump directly to slide */
function go(newIndex) {

  if (locked) return;

  index = newIndex;
  move(true);
}

/* Move forward */
function next() {

  if (locked) return;

  locked = true;

  index++;
  move(true);

  setTimeout(() => {

    /*
    When the duplicate Huhtamaki slide is reached,
    silently reset to the real Huhtamaki slide.
    This prevents the backwards race.
    */

    if (index === realCount) {

      index = 0;

      move(false);

      /* Force browser to register reset */
      track.offsetHeight;
    }

    locked = false;

  }, 1200);
}

/* Move backwards manually */
function previous() {

  if (locked) return;

  if (index === 0) {

    index = realCount - 1;

    move(false);

    track.offsetHeight;

  } else {

    index--;
  }

  move(true);
}

/* Autoplay */
function startAutoplay() {

  timer = setInterval(() => {
    next();
  }, 5000);
}

/* Restart autoplay after manual interaction */
function restart() {

  clearInterval(timer);

  startAutoplay();
}

/* Arrow controls */
document.getElementById('next').onclick = () => {

  next();

  restart();
};

document.getElementById('prev').onclick = () => {

  previous();

  restart();
};

/* Mobile swipe */
carousel.addEventListener(
  'touchstart',
  event => {

    startX = event.touches[0].clientX;

  },
  { passive: true }
);

carousel.addEventListener(
  'touchend',
  event => {

    if (startX === null) return;

    const difference =
      event.changedTouches[0].clientX - startX;

    if (Math.abs(difference) > 45) {

      difference < 0
        ? next()
        : previous();

      restart();
    }

    startX = null;

  },
  { passive: true }
);

/* Keyboard arrows */
document.addEventListener(
  'keydown',
  event => {

    if (event.key === 'ArrowLeft') {

      previous();

      restart();
    }

    if (event.key === 'ArrowRight') {

      next();

      restart();
    }
  }
);

/* Initialise */
move(false);
startAutoplay();

</script>

</body>
</html>
